<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정관 맛집 지도</title>
<style>
:root {
  --bg: #f5f6f3; --surface: #ffffff; --fg: #17201d; --muted: #5b6963; --line: #d9dfda;
  --accent: #b4432a; --accent-ink: #ffffff; --chip: #eceee9; --star: #d99a2b;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1412; --surface: #182120; --fg: #e9efec; --muted: #9eaea8; --line: #27342f;
          --accent: #ee8a6f; --accent-ink: #1a0d08; --chip: #1f2b28; --star: #e8b04e; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
header { padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { margin: 0 0 8px; font-size: 18px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { flex: 1 1 140px; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; }
.chip { flex: none; font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
#map { flex: 0 0 42%; min-height: 220px; background: var(--chip); position: relative; }
#msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; text-align: center; color: var(--muted); }
#list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
#list li { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
#list li[aria-selected=true] { background: var(--chip); }
.nm { font-weight: 600; }
.sub { font-size: 12.5px; color: var(--muted); }
.stars { color: var(--star); white-space: nowrap; font-size: 13px; }
.count { padding: 8px 14px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface); }
#card { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,.18); max-height: 58%; overflow-y: auto; display: none; z-index: 5; }
#card h2 { margin: 0; font-size: 17px; padding-right: 36px; }
#card .x { position: absolute; top: 10px; right: 12px; font: inherit; font-size: 20px; line-height: 1; border: 0; background: none; color: var(--muted); padding: 6px; cursor: pointer; }
.ai { margin: 10px 0; padding: 9px 11px; background: var(--chip); border-radius: 8px; font-size: 14px; }
.ai b { font-size: 12px; color: var(--accent); display: block; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.links a { font-size: 13.5px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; background: var(--bg); }
.memo label { font-size: 12.5px; color: var(--muted); display: block; margin-top: 8px; }
.rate { display: flex; gap: 2px; }
.rate button { font-size: 22px; border: 0; background: none; color: var(--line); cursor: pointer; padding: 2px 3px; }
.rate button.on { color: var(--star); }
textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 62px; }
.save { margin-top: 8px; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.saved { font-size: 12.5px; color: var(--muted); margin-left: 8px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>정관 맛집 지도</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="식당 이름 검색" aria-label="식당 이름 검색">
    <select id="sort" aria-label="정렬"><option value="dist">가까운 순</option><option value="mine">내 별점 순</option><option value="name">이름 순</option></select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="음식 종류"></div>
</header>
<div id="map"><div id="msg"></div></div>
<div class="count" id="count">불러오는 중</div>
<ul id="list"></ul>
<section id="card" aria-live="polite"></section>

<script>
/* ===== 설정: 여기만 고치면 돼요 ===== */
const CONFIG = {
  KAKAO_JS_KEY: "",                               // 카카오 개발자 사이트에서 받은 JavaScript 키
  CENTER: { lat: 35.3225, lng: 129.1795 },        // 지도 중심(정관읍 근처). 어긋나면 숫자를 조금 고치세요
  AREA_WORD: "정관",                              // 주소에 이 글자가 들어간 식당만 보여 줘요
  GRID_KM: 1.2,                                   // 식당을 모으는 간격(km)
  RADIUS_M: 900,                                  // 한 지점에서 찾는 반경(m)
  CACHE_HOURS: 24                                 // 같은 결과를 이 시간 동안 재사용
};
/* ================================== */

const $ = (s) => document.querySelector(s);
const state = { places: [], markers: new Map(), cat: "전체", q: "", sort: "dist", sel: null, map: null, oneliners: {} };
const mem = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const myMemo = (id) => mem.get("memo:" + id) || { rating: 0, text: "" };
const catOf = (p) => (p.category_name.split(" > ")[1] || "기타").replace(/\s/g, "");
const stars = (n) => n ? "★".repeat(n) + "☆".repeat(5 - n) : "";

function showMsg(t) { const m = $("#msg"); m.textContent = t; m.style.display = "flex"; }

async function loadOneLiners() {
  try { const r = await fetch("oneliners.json", { cache: "no-store" }); if (r.ok) state.oneliners = await r.json(); } catch (e) {}
}

function boot() {
  if (!CONFIG.KAKAO_JS_KEY) { showMsg("카카오 JavaScript 키가 아직 없어요. index.html 위쪽 CONFIG의 KAKAO_JS_KEY에 넣어 주세요."); $("#count").textContent = ""; return; }
  const s = document.createElement("script");
  s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + encodeURIComponent(CONFIG.KAKAO_JS_KEY) + "&libraries=services&autoload=false";
  s.onload = () => kakao.maps.load(init);
  s.onerror = () => showMsg("지도를 불러오지 못했어요. 키와 등록한 사이트 주소(도메인)를 확인해 주세요.");
  document.head.appendChild(s);
}

function gridPoints() {
  const dLat = CONFIG.GRID_KM / 111, dLng = CONFIG.GRID_KM / (111 * Math.cos(CONFIG.CENTER.lat * Math.PI / 180));
  const pts = [];
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) pts.push({ lat: CONFIG.CENTER.lat + i * dLat, lng: CONFIG.CENTER.lng + j * dLng });
  return pts;
}

function searchPoint(ps, pt) {
  return new Promise((resolve) => {
    const out = [];
    const cb = (data, status, pg) => {
      if (status === kakao.maps.services.Status.OK) {
        out.push(...data);
        if (pg.hasNextPage) { pg.nextPage(); return; }
      }
      resolve(out);
    };
    ps.categorySearch("FD6", cb, { location: new kakao.maps.LatLng(pt.lat, pt.lng), radius: CONFIG.RADIUS_M, sort: kakao.maps.services.SortBy.DISTANCE });
  });
}

async function fetchPlaces() {
  const ck = mem.get("places-cache");
  if (ck && Date.now() - ck.t < CONFIG.CACHE_HOURS * 3600e3 && ck.v && ck.v.length) return ck.v;
  const ps = new kakao.maps.services.Places();
  const seen = new Map();
  for (const pt of gridPoints()) {
    const rows = await searchPoint(ps, pt);
    rows.forEach((r) => { if (!seen.has(r.id) && (r.address_name || "").includes(CONFIG.AREA_WORD)) seen.set(r.id, r); });
  }
  const v = [...seen.values()];
  if (v.length) mem.set("places-cache", { t: Date.now(), v });
  return v;
}

const km = (a, b) => Math.hypot((a.y - CONFIG.CENTER.lat) * 111, (a.x - CONFIG.CENTER.lng) * 111 * Math.cos(CONFIG.CENTER.lat * Math.PI / 180));

async function init() {
  const map = new kakao.maps.Map($("#map"), { center: new kakao.maps.LatLng(CONFIG.CENTER.lat, CONFIG.CENTER.lng), level: 5 });
  state.map = map;
  await loadOneLiners();
  try { state.places = await fetchPlaces(); } catch (e) { showMsg("식당 정보를 가져오지 못했어요. 잠시 뒤 다시 열어 보세요."); }
  if (!state.places.length) { $("#count").textContent = "표시할 식당이 없어요"; return; }
  state.places.forEach((p) => {
    p._d = km(p);
    const mk = new kakao.maps.Marker({ position: new kakao.maps.LatLng(p.y, p.x), title: p.place_name });
    kakao.maps.event.addListener(mk, "click", () => select(p.id, false));
    state.markers.set(p.id, mk);
  });
  buildChips(); render();
}

function buildChips() {
  const cnt = {}; state.places.forEach((p) => { const c = catOf(p); cnt[c] = (cnt[c] || 0) + 1; });
  const cats = ["전체", ...Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])];
  const box = $("#chips"); box.innerHTML = "";
  cats.forEach((c) => {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button";
    b.textContent = c === "전체" ? "전체 " + state.places.length : c + " " + cnt[c];
    b.setAttribute("aria-pressed", String(c === state.cat));
    b.onclick = () => { state.cat = c; buildChips(); render(); };
    box.appendChild(b);
  });
}

function visible() {
  let v = state.places.filter((p) => (state.cat === "전체" || catOf(p) === state.cat) && (!state.q || p.place_name.includes(state.q)));
  if (state.sort === "dist") v.sort((a, b) => a._d - b._d);
  else if (state.sort === "name") v.sort((a, b) => a.place_name.localeCompare(b.place_name, "ko"));
  else v.sort((a, b) => myMemo(b.id).rating - myMemo(a.id).rating || a._d - b._d);
  return v;
}

function render() {
  const v = visible(), ids = new Set(v.map((p) => p.id));
  state.markers.forEach((mk, id) => mk.setMap(ids.has(id) ? state.map : null));
  $("#count").textContent = v.length + "곳";
  const ul = $("#list"); ul.innerHTML = "";
  v.forEach((p) => {
    const li = document.createElement("li"); li.dataset.id = p.id;
    li.setAttribute("aria-selected", String(p.id === state.sel));
    const left = document.createElement("div");
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.place_name;
    const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = p.category_name.split(" > ").slice(1).join(" · ") + " · " + (p.road_address_name || p.address_name);
    left.append(nm, sub);
    const st = document.createElement("div"); st.className = "stars"; st.textContent = stars(myMemo(p.id).rating);
    li.append(left, st);
    li.onclick = () => select(p.id, true);
    ul.appendChild(li);
  });
}

function select(id, pan) {
  const p = state.places.find((x) => x.id === id); if (!p) return;
  state.sel = id;
  if (pan) state.map.panTo(new kakao.maps.LatLng(p.y, p.x));
  document.querySelectorAll("#list li").forEach((li) => li.setAttribute("aria-selected", String(li.dataset.id === id)));
  openCard(p);
}

function openCard(p) {
  const card = $("#card"); card.innerHTML = ""; card.style.display = "block";
  const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "닫기");
  x.onclick = () => { card.style.display = "none"; };
  const h = document.createElement("h2"); h.textContent = p.place_name;
  const sub = document.createElement("div"); sub.className = "sub";
  sub.textContent = p.category_name.split(" > ").slice(1).join(" · ") + " · " + (p.road_address_name || p.address_name) + (p.phone ? " · " + p.phone : "");
  card.append(x, h, sub);
  const one = state.oneliners[p.place_name];
  const ai = document.createElement("div"); ai.className = "ai";
  const lab = document.createElement("b"); lab.textContent = "AI 한줄평";
  ai.append(lab, document.createTextNode(one || "아직 한줄평이 없어요."));
  card.appendChild(ai);
  const links = document.createElement("div"); links.className = "links";
  [["카카오맵", p.place_url],
   ["네이버 지도", "https://map.naver.com/p/search/" + encodeURIComponent(CONFIG.AREA_WORD + " " + p.place_name)],
   ["구글 지도", "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.place_name + " " + (p.road_address_name || p.address_name))]
  ].forEach(([t, u]) => { const a = document.createElement("a"); a.textContent = t; a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; links.appendChild(a); });
  card.appendChild(links);
  const m = myMemo(p.id), box = document.createElement("div"); box.className = "memo";
  const l1 = document.createElement("label"); l1.textContent = "내 별점";
  const rate = document.createElement("div"); rate.className = "rate"; let cur = m.rating;
  const paint = () => rate.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i < cur));
  for (let i = 1; i <= 5; i++) { const b = document.createElement("button"); b.type = "button"; b.textContent = "★"; b.setAttribute("aria-label", i + "점"); b.onclick = () => { cur = cur === i ? 0 : i; paint(); }; rate.appendChild(b); }
  paint();
  const l2 = document.createElement("label"); l2.textContent = "내 메모"; l2.htmlFor = "memoText";
  const ta = document.createElement("textarea"); ta.id = "memoText"; ta.value = m.text; ta.placeholder = "가 본 느낌, 메뉴, 가격 등";
  const sv = document.createElement("button"); sv.type = "button"; sv.className = "save"; sv.textContent = "저장";
  const ok = document.createElement("span"); ok.className = "saved";
  sv.onclick = () => { mem.set("memo:" + p.id, { rating: cur, text: ta.value }); ok.textContent = "저장했어요 (이 기기에만 저장돼요)"; render(); };
  box.append(l1, rate, l2, ta, sv, ok); card.appendChild(box);
}

$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
boot();
</script>
</body>
</html>
